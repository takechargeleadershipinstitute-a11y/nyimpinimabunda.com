<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Recover earlier book orders | TCLI</title>
<style>
body{font-family:Arial,sans-serif;background:#FAF6EF;color:#051A52;margin:0;padding:40px 20px;line-height:1.55}
main{max-width:620px;margin:0 auto;background:#fff;border:1px solid #E6DFD2;padding:32px}
h1{font-size:24px;margin:0 0 8px}
p{color:#6B6459;margin:0 0 16px}
input{width:100%;box-sizing:border-box;font-size:16px;padding:13px;border:1px solid #E6DFD2;margin-bottom:12px}
button{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:15px 20px;border:0;background:#051A52;color:#fff;cursor:pointer;width:100%}
button:disabled{opacity:.5}
.msg{padding:12px 14px;margin-top:14px;background:#F5F1E8;color:#051A52}
.err{background:#fbeceb;color:#8E332C}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:16px}
td,th{border-bottom:1px solid #E6DFD2;padding:6px 4px;text-align:left}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Recover earlier book orders</h1>
  <p>One-off page. It signs in to the previous database, which still holds every book order placed before 1 October 2026, and saves them as a file so they can be added to the new system.</p>

  <section id="vSign">
    <label for="em">Your admin email address</label>
    <input id="em" type="email" autocomplete="email" placeholder="name@example.com">
    <button id="send" type="button">Email me a sign-in link</button>
  </section>

  <section id="vApp" hidden>
    <p id="who"></p>
    <button id="dl" type="button" disabled>Download the orders file</button>
    <div id="tbl"></div>
  </section>

  <p class="msg" id="msg" hidden></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
/* Reads public.book_preorders from the PREVIOUS Supabase project through its
   list_book_orders() function, which only answers a signed-in editor. Nothing
   is written anywhere. Remove this page once the orders have been carried over. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function say(t, err) { var m = $('msg'); m.textContent = t; m.className = 'msg' + (err ? ' err' : ''); m.hidden = !t; }
  if (!window.supabase) return say('The page could not load. Check your connection and refresh.', true);

  var hp = new URLSearchParams(location.hash.slice(1));
  if (hp.get('error_code')) { say('That sign-in link has expired or was already used. Request a new one.', true); history.replaceState(null, '', location.pathname); }

  var sb = window.supabase.createClient('https://cbbhgoahhykpckbtlzkr.supabase.co', 'sb_publishable_RldFFBVH4R8nPDyRlxA0tA__j8mMICa', {
    auth: { flowType: 'implicit', persistSession: true, detectSessionInUrl: true, storageKey: 'tcli-recover' }
  });
  var rows = null;

  $('send').addEventListener('click', async function () {
    var email = $('em').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return say('Please enter your email address.', true);
    $('send').disabled = true;
    var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + '/recover/', shouldCreateUser: true } });
    $('send').disabled = false;
    if (r.error) return say('The link could not be sent: ' + r.error.message, true);
    say('Check your inbox for the sign-in link and open it on this computer. It comes from Supabase.');
  });

  async function load(user) {
    $('vSign').hidden = true; $('vApp').hidden = false;
    $('who').textContent = 'Signed in as ' + user.email + '. Loading the earlier orders…';
    var r = await sb.rpc('list_book_orders');
    if (r.error) {
      $('who').textContent = 'Signed in as ' + user.email + '.';
      return say(r.error.code === '42501'
        ? 'This email address is not on the previous admin list. Sign in with zimasa@takechargeli.co.za or ghoberts@gmail.com.'
        : 'The orders could not be read: ' + r.error.message, true);
    }
    rows = r.data || [];
    $('who').textContent = 'Signed in as ' + user.email + '. Found ' + rows.length + ' earlier orders.';
    $('dl').disabled = false;
    var t = document.createElement('table'), h = t.insertRow();
    ['When', 'Ref', 'Book', 'Name', 'Status'].forEach(function (x) { var th = document.createElement('th'); th.textContent = x; h.appendChild(th); });
    rows.forEach(function (o) {
      var tr = t.insertRow();
      [new Date(o.created_at).toLocaleString('en-ZA'), o.order_ref || '', o.book, (o.first_name || '') + ' ' + (o.last_name || ''), o.status]
        .forEach(function (x) { tr.insertCell().textContent = x; });
    });
    $('tbl').textContent = ''; $('tbl').appendChild(t);
  }

  $('dl').addEventListener('click', function () {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(rows, null, 1)], { type: 'application/json' }));
    a.download = 'tcli-earlier-book-orders.json';
    document.body.appendChild(a); a.click(); a.remove();
    say('Saved to your Downloads folder as tcli-earlier-book-orders.json. Tell Claude it is there.');
  });

  sb.auth.onAuthStateChange(function (ev, session) {
    if (session && session.user) setTimeout(function () { load(session.user); }, 0);
  });
})();
</script>
</body>
</html>
